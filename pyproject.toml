[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-finance-intelligence"
version = "0.1.0"
description = "Aurora Finance Intelligence: dados que antecipam riscos, revelam padrões e apoiam decisões financeiras mais humanas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib==1.5.2",
  "jupyterlab==4.4.7",
  "matplotlib==3.10.7",
  "numpy==2.3.3",
  "pandas==2.3.2",
  "scikit-learn==1.7.2",
]

[tool.setuptools]
packages = ["src"]
